name: 竹知了事件官媒追踪（20:00）

on:
  schedule:
    # 北京时间 20:00 = UTC 12:00
    - cron: "0 12 * * *"
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  zhuzhilao-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run zhuzhilao monitor
        env:
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
        run: python zhuzhilao_monitor.py

      - name: Commit state update
        run: |
          git config user.name "Fakao Bot"
          git config user.email "bot@fakao-monitor.local"
          git add zhuzhilao_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update zhuzhilao state [skip ci]"
          git push
